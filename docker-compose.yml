services:
  db:
    image: postgres:16-alpine
    container_name: itms_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: itms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override DATABASE_URL to use the db service
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: itms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # No env_file needed for frontend unless we need to configure API URL
    # We''ll rely on the frontend being served and making requests to the backend via relative paths or environment variables
    # For simplicity, we assume the frontend is served from the same origin and uses relative URLs to talk to backend
    # If needed, we can add environment variables for VITE_API_URL

volumes:
  postgres_data:
  uploads: